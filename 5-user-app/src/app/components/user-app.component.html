<div class="container my-4">
    <h3> {{ title }}</h3>

    @if (!open) {
        <button 
        class="btn btn-primary"
        (click)="setOpen()">Crear usuario</button>
    }
    
    <div class="row">
            <div class="col">
                <user 
                [users]="users" 
                (idUserEventEmitter)="removeUser($event)"
                (selectedUserEventEmitter)="setSelectedUser($event)"
                />
            </div>
    </div>
</div>

@if (open) {
    <div>
        <user-form 
        (newUserEventEmitter)="addUser($event)"
        [user]="userSelected"
        (openEventEmitter)="setOpen()"
        />
    </div>
}
